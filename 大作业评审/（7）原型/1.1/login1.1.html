<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI课程教辅系统 - 登录页</title>
<style>
:root{--blue:#2563eb;--purple:#7c3aed;--cyan:#06b6d4;--bg:#f5f7fb;--text:#172033;--muted:#6b7280;--card:#fff;--line:#e5e7eb;--danger:#ef4444;--ok:#16a34a;--warn:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(135deg,#eef6ff 0%,#f8f5ff 45%,#ecfeff 100%);color:var(--text)}
.page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}.hero{position:relative;padding:72px 72px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 18% 20%,rgba(37,99,235,.22),transparent 28%),radial-gradient(circle at 82% 75%,rgba(124,58,237,.24),transparent 35%)}
.logo{display:inline-flex;align-items:center;gap:12px;font-weight:800;font-size:22px;margin-bottom:54px}.logo-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;color:#fff;box-shadow:0 14px 30px rgba(37,99,235,.28)}
h1{font-size:56px;line-height:1.08;margin:0 0 22px;letter-spacing:-1px}.subtitle{font-size:22px;color:#334155;margin-bottom:34px}.tags{display:flex;gap:12px;flex-wrap:wrap}.tag{padding:10px 14px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:999px;color:#334155;backdrop-filter:blur(8px)}
.flow{margin-top:54px;display:flex;gap:14px;align-items:center;color:#475569}.flow span{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;box-shadow:0 10px 26px rgba(15,23,42,.07)}.arrow{color:var(--blue);font-weight:900}.login-wrap{display:flex;align-items:center;justify-content:center;padding:50px}.card{width:460px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:34px;box-shadow:0 24px 80px rgba(15,23,42,.13);backdrop-filter:blur(14px)}
.card h2{font-size:30px;margin:0 0 8px}.hint{color:var(--muted);margin:0 0 28px}.field{margin-bottom:18px}.field label{display:block;font-weight:700;margin-bottom:8px}.input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font-size:15px;background:#fff;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 22px;color:#64748b}.row a{color:var(--blue);text-decoration:none}.btn{width:100%;height:50px;border:0;border-radius:16px;color:#fff;font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 14px 30px rgba(37,99,235,.28);cursor:pointer;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px);box-shadow:0 18px 36px rgba(37,99,235,.32)}
.btn-secondary{width:100%;height:50px;border:2px solid var(--line);border-radius:16px;color:#475569;font-size:16px;font-weight:800;background:#fff;cursor:pointer;margin-top:12px;transition:all .15s}.btn-secondary:hover{border-color:var(--blue);color:var(--blue);background:rgba(37,99,235,.04)}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:#94a3b8;font-size:13px}.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.account-field{position:relative}.account-options{display:none;position:absolute;left:0;right:0;top:76px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 36px rgba(15,23,42,.12);overflow:hidden;z-index:20}.account-options.show{display:block}.account-option{display:block;width:100%;border:0;background:#fff;padding:13px 14px;text-align:left;font-size:15px;color:#334155;cursor:pointer}.account-option:hover{background:#eff6ff;color:var(--blue)}
@media(max-width:900px){.page{grid-template-columns:1fr}.hero{padding:46px 28px}.login-wrap{padding:28px}.card{width:100%}h1{font-size:40px}.flow{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div class="logo"><div class="logo-mark">AI</div>AI课程教辅系统</div>
    <h1>《软件需求分析原理与实践》的智能教学辅助平台</h1>
    <div class="tags"><span class="tag">AI 解析课程资源</span><span class="tag">RAG 课程知识库</span><span class="tag">知识图谱可视化</span><span class="tag">能力诊断与个性化路径</span></div>
    <div class="flow"><span>资源导入</span><b class="arrow">→</b><span>AI解析</span><b class="arrow">→</b><span>教师审核</span><b class="arrow">→</b><span>学生练习</span><b class="arrow">→</b><span>能力诊断</span></div>
  </section>
  <section class="login-wrap">
    <div class="card">
      <h2>欢迎登录</h2>
      <p class="hint">请输入账号密码进入系统</p>
      <div class="field account-field">
        <label>账号</label>
        <input class="input" id="accountInput" placeholder="请选择账号" value="teacher001" readonly onclick="toggleAccountOptions()" onfocus="toggleAccountOptions()">
        <div class="account-options" id="accountOptions">
          <button type="button" class="account-option" onclick="selectAccount('student','student001')">学生</button>
          <button type="button" class="account-option" onclick="selectAccount('teacher','teacher001')">教师</button>
          <button type="button" class="account-option" onclick="selectAccount('admin','admin001')">管理员</button>
        </div>
      </div>
      <div class="field"><label>密码</label><input class="input" type="password" placeholder="请输入密码" value="123456"></div>
      <div class="row"><label><input type="checkbox" checked> 记住我</label><a href="#">忘记密码？</a></div>
      <button class="btn" onclick="login()">登录进入系统</button>
      <div class="divider">或</div>
      <button class="btn-secondary" onclick="location.href='register(1).html'">注册新账号</button>
    </div>
  </section>
</div>
<script>
let selectedRole = 'teacher';
function toggleAccountOptions(){
  document.getElementById('accountOptions').classList.add('show');
}
function selectAccount(role,label){
  selectedRole = role;
  document.getElementById('accountInput').value = label;
  document.getElementById('accountOptions').classList.remove('show');
}
function login(){
  const pages = {
    student:'student1.1.html',
    teacher:'teacher1.1(1).html',
    admin:'admin1.1(1).html'
  };
  location.href = pages[selectedRole];
}
document.addEventListener('click',function(e){
  const field = document.querySelector('.account-field');
  if(!field.contains(e.target)){
    document.getElementById('accountOptions').classList.remove('show');
  }
});
</script>
</body>
</html>
